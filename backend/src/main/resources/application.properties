spring.application.name=tradenest
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/zerodha;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:TradeNest-Production-Secret-Key-2026-Change-This-Immediately-For-Deployment-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
