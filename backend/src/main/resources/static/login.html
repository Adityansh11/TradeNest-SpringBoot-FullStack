<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TradeNest | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                TradeNest
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your trading account
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>


            <p id="loginMessage"
               class="auth-message">
            </p>


            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create account
                </a>

            </div>

        </div>

    </div>


    <script>

        const API = "/api";


        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                message.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            `${API}/auth/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username,
                                    password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Invalid username or password.";

                        return;
                    }


                    // Store logged-in user

                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    localStorage.setItem(
                        "userId",
                        data.userId
                    );

                    localStorage.setItem(
                        "username",
                        data.username
                    );

                    localStorage.setItem(
                        "name",
                        data.name
                    );


                    // Go to dashboard

                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            });

    </script>

</body>

</html>
