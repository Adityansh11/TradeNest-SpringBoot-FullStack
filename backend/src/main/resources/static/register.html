<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TradeNest | Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                TradeNest
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start your trading journey
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    Create Account

                </button>

            </form>


            <p id="registerMessage"
               class="auth-message">
            </p>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>

        const API = "/api";


        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document.getElementById(
                            "registerMessage"
                        );


                    message.textContent =
                        "Creating account...";


                    try {

                        const response =
                            await fetch(
                                `${API}/auth/register`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        name,
                                        username,
                                        password
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            message.textContent =
                                data.message ||
                                "Registration failed.";

                            return;
                        }


                        // Automatically log user in

                        localStorage.setItem(
                            "token",
                            data.token
                        );

                        localStorage.setItem(
                            "userId",
                            data.userId
                        );

                        localStorage.setItem(
                            "username",
                            data.username
                        );

                        localStorage.setItem(
                            "name",
                            data.name
                        );


                        window.location.href =
                            "index.html";

                    } catch (error) {

                        console.error(error);

                        message.textContent =
                            "Unable to connect to server.";

                    }

                }
            );

    </script>

</body>

</html>
